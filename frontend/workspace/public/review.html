<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axiomics · 注册审核</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6f7;
    --panel: #ffffff;
    --border: #dfe3e8;
    --text: #20252b;
    --muted: #626a75;
    --brand: #376d70;
    --warn: #9a6a22;
    --warn-bg: #fcf4ea;
    --danger: #b54d4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 24px 80px; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
  .sub { margin: 0; color: var(--muted); font-size: 13px; }
  .back { color: var(--brand); text-decoration: none; font-size: 13px; white-space: nowrap; }
  .back:hover { text-decoration: underline; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 8px 24px rgb(17 24 39 / 5%);
    overflow: hidden;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .count { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
  .pill {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--warn-bg);
    color: var(--warn);
    font-size: 12px;
    font-weight: 600;
  }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid transparent;
    border-radius: 9px;
    padding: 8px 14px;
  }
  .ghost { background: #fff; border-color: var(--border); color: var(--text); }
  .ghost:hover { background: #f7f9fa; }
  .primary { background: var(--brand); color: #fff; font-weight: 600; }
  .primary:hover { background: #2f6063; }
  .danger { background: #fff; border-color: #e7c4c1; color: var(--danger); }
  .danger:hover { background: #fff6f5; }
  button:disabled { opacity: 0.55; cursor: default; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 18px; border-bottom: 1px solid #edf0f3; text-align: left; }
  th { background: #fafbfc; color: var(--muted); font-size: 12px; font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  .user { font-weight: 600; }
  .time { color: var(--muted); font-size: 12.5px; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; }
  .empty, .loading, .error { padding: 36px 18px; text-align: center; color: var(--muted); }
  .error { color: var(--danger); }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    padding: 10px 16px;
    border-radius: 10px;
    background: #20252b;
    color: #fff;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
  .toast.bad { background: var(--danger); }
  dialog {
    width: calc(100% - 40px);
    max-width: 360px;
    border: 0;
    border-radius: 14px;
    padding: 0;
    box-shadow: 0 24px 60px rgb(0 0 0 / 25%);
  }
  dialog::backdrop { background: rgb(15 23 42 / 35%); }
  .dlg { padding: 22px; }
  .dlg h2 { margin: 0 0 8px; font-size: 16px; }
  .dlg p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .dlg .row { display: flex; gap: 10px; justify-content: flex-end; }
  @media (max-width: 620px) {
    .wrap { padding: 24px 14px 60px; }
    th:nth-child(2), td:nth-child(2) { display: none; }
    .actions { flex-direction: column; }
    .actions button { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>注册审核</h1>
      <p class="sub">用户自己注册后会出现在这里。通过后约 1 分钟内自动开通工作区；拒绝会保留账号并标记为“已拒绝”。管理员代建的账号不必经过这里。队列清空后会自动返回数据看板。</p>
    </div>
    <a class="back" href="/console">数据看板 →</a>
  </header>

  <div class="card">
    <div class="bar">
      <div class="count">待审核 <span class="pill" id="count">0</span></div>
      <button class="ghost" id="refresh" type="button">刷新</button>
    </div>
    <div id="view" aria-live="polite"><div class="loading">正在读取…</div></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<dialog id="reject">
  <form method="dialog" class="dlg" id="rejectForm">
    <h2>拒绝这个注册？</h2>
    <p id="rejectText">账号会保留，但会被标记为“已拒绝”并禁用，用户将无法登录。</p>
    <div class="row">
      <button class="ghost" type="submit" value="cancel">取消</button>
      <button class="danger" type="submit" value="ok">确认拒绝</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  try { sessionStorage.setItem("ax_review_landed", "1"); } catch (e) {}
  var state = { users: [], busy: false };
  var acted = false;
  var returning = false;
  var landing = false;
  var landingChecked = false;
  try { landing = new URLSearchParams(location.search).get("landing") === "1"; } catch (e) {}
  var view = document.getElementById("view");
  var count = document.getElementById("count");
  var refresh = document.getElementById("refresh");
  var toast = document.getElementById("toast");
  var reject = document.getElementById("reject");
  var rejectText = document.getElementById("rejectText");
  var pendingReject = null;

  function showToast(text, bad) {
    toast.textContent = text;
    toast.className = "toast show" + (bad ? " bad" : "");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(function () { toast.className = "toast"; }, 2600);
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function time(value) {
    if (!value) return "—";
    var date = new Date(value);
    if (isNaN(date.getTime())) return value;
    return date.toLocaleString("zh-CN", { hour12: false });
  }

  async function api(path, body) {
    var response = await fetch(path, {
      method: body === undefined ? "GET" : "POST",
      credentials: "include",
      headers: body === undefined
        ? { Accept: "application/json" }
        : { "Content-Type": "application/json", Accept: "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    var data = await response.json();
    if (!response.ok || data.status !== "ok") throw new Error(data.msg || ("HTTP " + response.status));
    return data;
  }

  function render() {
    count.textContent = String(state.users.length);
    view.replaceChildren();
    if (!state.users.length) {
      view.append(el("div", "empty", "没有待审核的注册。"));
      return;
    }
    var table = el("table");
    var head = el("thead");
    var headRow = el("tr");
    ["用户", "注册时间", "状态", "操作"].forEach(function (label) {
      headRow.append(el("th", null, label));
    });
    head.append(headRow);
    table.append(head);

    var body = el("tbody");
    state.users.forEach(function (user) {
      var row = el("tr");
      row.append(el("td", "user", user.name));
      row.append(el("td", "time", time(user.createdTime)));
      var status = el("td");
      status.append(el("span", "pill", "待审核"));
      row.append(status);

      var actions = el("td", "actions");
      var approve = el("button", "primary", "通过");
      approve.type = "button";
      approve.addEventListener("click", function () { approveUser(user, approve); });
      var deny = el("button", "danger", "拒绝");
      deny.type = "button";
      deny.addEventListener("click", function () {
        pendingReject = user;
        rejectText.textContent = "账号「" + user.name + "」会保留，但会被标记为“已拒绝”并禁用，用户将无法登录。";
        reject.showModal();
      });
      actions.append(approve, deny);
      row.append(actions);
      body.append(row);
    });
    table.append(body);
    view.append(table);
  }

  function maybeReturn() {
    if (!acted || state.users.length || returning) return;
    returning = true;
    var empty = view.querySelector(".empty");
    if (!empty) {
      view.replaceChildren(el("div", "empty", "队列已清空，正在返回数据看板…"));
    } else {
      empty.textContent = "队列已清空，正在返回数据看板…";
    }
    setTimeout(function () { location.assign("/console"); }, 1600);
  }

  async function load() {
    refresh.disabled = true;
    try {
      var data = await api("/console/api/get-users?owner=axiomics");
      var users = (data.data || []).filter(function (user) {
        return user.tag === "pending" && !user.isForbidden;
      });
      users.sort(function (a, b) {
        return String(a.createdTime).localeCompare(String(b.createdTime));
      });
      state.users = users;
      render();
      if (landing && !landingChecked) {
        landingChecked = true;
        if (!state.users.length) {
          var empty = view.querySelector(".empty");
          if (empty) empty.textContent = "队列为空，正在返回数据看板…";
          try { history.replaceState({}, "", "/console/review"); } catch (e) {}
          setTimeout(function () {
            if (!state.users.length) location.assign("/console");
          }, 1000);
          return;
        }
        try {
          var url = new URL(location.href);
          url.searchParams.delete("landing");
          history.replaceState({}, "", url.pathname + url.search + url.hash);
        } catch (e) {}
      }
    } catch (error) {
      view.replaceChildren(el("div", "error", "无法读取用户列表：" + error.message));
      count.textContent = "—";
    } finally {
      refresh.disabled = false;
    }
  }

  async function userObject(name) {
    var data = await api("/console/api/get-user?id=" + encodeURIComponent("axiomics/" + name));
    return data.data;
  }

  async function approveUser(user, button) {
    if (state.busy) return;
    state.busy = true;
    button.disabled = true;
    button.textContent = "通过中…";
    try {
      var full = await userObject(user.name);
      full.tag = "active";
      full.isForbidden = false;
      await api("/console/api/update-user?id=" + encodeURIComponent("axiomics/" + user.name), full);
      acted = true;
      state.users = state.users.filter(function (item) { return item.name !== user.name; });
      render();
      showToast("已通过「" + user.name + "」，约 1 分钟内开通。");
      setTimeout(maybeReturn, 600);
    } catch (error) {
      showToast("通过失败：" + error.message, true);
      button.disabled = false;
      button.textContent = "通过";
    } finally {
      state.busy = false;
    }
  }

  document.getElementById("rejectForm").addEventListener("submit", async function (event) {
    if (event.submitter && event.submitter.value !== "ok") return;
    event.preventDefault();
    var user = pendingReject;
    if (!user) return;
    reject.close();
    pendingReject = null;
    if (state.busy) return;
    state.busy = true;
    try {
      var full = await userObject(user.name);
      full.tag = "rejected";
      full.isForbidden = true;
      await api("/console/api/update-user?id=" + encodeURIComponent("axiomics/" + user.name), full);
      acted = true;
      state.users = state.users.filter(function (item) { return item.name !== user.name; });
      render();
      showToast("已拒绝「" + user.name + "」，账号已保留并禁用。");
      setTimeout(maybeReturn, 600);
    } catch (error) {
      showToast("拒绝失败：" + error.message, true);
      await load();
    } finally {
      state.busy = false;
    }
  });

  refresh.addEventListener("click", load);
  load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
